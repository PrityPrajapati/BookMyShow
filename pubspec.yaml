name: showscape
description: "ShowScape - AI-first Ticket Booking & Going-Out Discovery App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Code Generation & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Firebase Suite
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.3.3
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  firebase_vertexai: ^1.6.0
  google_generative_ai: ^0.4.6

  # Local Notifications & Time
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # UI Components & Media
  table_calendar: ^3.1.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.7
  google_maps_flutter: ^2.12.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  google_fonts: ^6.2.1

  # Payments & Local DB
  razorpay_flutter: ^1.4.0
  hive_flutter: ^1.1.0

  # Voice & Utilities
  speech_to_text: ^7.0.0
  intl: ^0.20.2
  screen_brightness: ^2.1.11
  wakelock_plus: ^1.6.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0B0B14"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#0B0B14"
  color_dark: "#0B0B14"
  image: "assets/images/splash.png"
  image_dark: "assets/images/splash.png"
  android_12:
    color: "#0B0B14"
    color_dark: "#0B0B14"
    image: "assets/images/splash.png"
    image_dark: "assets/images/splash.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/mock/
